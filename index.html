<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대동교회 크리스마스 예배당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --card:#FBF4DF; --card-2:#F3E7C4; --ink:#24382C; --soft:#56685B; --glow:#E9A23B;
  --red:#B8433A; --line:rgba(36,56,44,.16); --btn:#24382C; --btn-ink:#FBF4DF; --shadow:0 10px 30px rgba(20,30,25,.25);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --card:#1F3127; --card-2:#283D31; --ink:#F3E6C2; --soft:#C3B791; --glow:#F0B054;
    --red:#E0675C; --line:rgba(243,230,194,.16); --btn:#F3E6C2; --btn-ink:#1F3127; --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --card:#1F3127; --card-2:#283D31; --ink:#F3E6C2; --soft:#C3B791; --glow:#F0B054;
  --red:#E0675C; --line:rgba(243,230,194,.16); --btn:#F3E6C2; --btn-ink:#1F3127; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#1B2A4A;color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#c:focus,#c:focus-visible{outline:none}
button{touch-action:manipulation}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
h1,h2{font-family:"Gowun Batang",serif;margin:0}
[hidden]{display:none!important}

/* 입장 화면 */
.entry{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:20;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,214,150,.18),rgba(10,18,40,.55) 70%)}
.entry-card{width:min(440px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--card);border-radius:28px;padding:26px 24px 22px;box-shadow:var(--shadow);text-align:center}
.entry-card h1{font-size:25px;line-height:1.35}
.entry-card p{margin:8px 0 0;color:var(--soft);font-size:15px;line-height:1.6}
#preview{width:100%;aspect-ratio:16/10;display:block;margin:12px 0 4px;border-radius:20px;background:linear-gradient(#2A3C6E,#5A6BA3 70%,#E9BC8C);cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.seg button{border:2px solid var(--line);background:transparent;border-radius:14px;padding:10px;font-size:16px}
.seg button[aria-checked="true"]{border-color:var(--ink);background:var(--card-2);font-weight:700}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:15px;text-align:left}
.swatches{display:flex;gap:8px}
.swatches button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatches button[aria-checked="true"]{border-color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--red)}
.field{display:block;margin-top:14px;text-align:left}
.field span{font-size:14px;color:var(--soft)}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card-2);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:6px}
textarea{resize:vertical;min-height:84px;line-height:1.6}
.primary{display:block;width:100%;margin-top:18px;border:none;border-radius:999px;padding:14px;font-size:17px;background:var(--btn);color:var(--btn-ink)}
.primary:hover{filter:brightness(1.08)}

/* HUD */
.hud{position:fixed;z-index:5}
.pill{background:var(--card);border-radius:999px;box-shadow:var(--shadow)}
.top-left{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;font-size:14px}
.top-left strong{font-family:"Gowun Batang",serif;font-size:16px}
.top-left .dot{width:9px;height:9px;border-radius:50%;background:#5DBB72;box-shadow:0 0 0 3px rgba(93,187,114,.25)}
.top-left .dot.off{background:#A8A08A;box-shadow:none}
.top-right{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;display:flex;gap:8px}
.top-right button,.top-right .linkbtn,.actions button{border:none;background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:15px;box-shadow:var(--shadow)}
.top-right .linkbtn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:0;width:40px;height:40px;font-size:18px;align-self:center}
#newsBtn .lbl,#instaBtn .lbl{display:inline}
.top-right .sl{display:none}
.top-right{gap:5px}
.top-right button,.top-right .linkbtn{padding:5px 10px;font-size:12px;width:auto;height:auto;align-self:center}
.top-left{font-size:13px;padding:6px 13px 6px 10px;gap:8px}
.top-left strong{font-size:14px}
@media (max-width:900px){.top-right button,.top-right .linkbtn{padding:4px 8px;font-size:11px}}
.top-right button .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;line-height:20px}
.actions{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 24px)}
.actions button.on,.top-right button.on{background:var(--btn);color:var(--btn-ink)}
.actions{gap:6px}
.actions button{padding:8px 13px;font-size:13.5px}
.emote-menu button{padding:8px 12px;font-size:13.5px}
/* labels kept on mobile */
.hint{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);font-size:13px;color:#F6EBCB;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none;transition:opacity .6s}
#joy{position:fixed;z-index:5;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:120px;height:120px;border-radius:50%;
  background:rgba(251,244,223,.22);border:2px solid rgba(251,244,223,.5);touch-action:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(251,244,223,.9)}
@media (pointer:coarse){#joy{display:block}.hint{display:none}}
@media (max-width:560px){
  .actions{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  .actions button{padding:9px 13px;font-size:14px}
  #joy{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
  .top-right button{padding:9px 12px;font-size:14px}
}

/* 패널 */
.panel{position:fixed;z-index:8;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);width:min(360px,calc(100% - 24px));
  height:min(520px,calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 150px));
  background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel header h2{font-size:18px}
.x{border:none;background:var(--card-2);border-radius:999px;width:34px;height:34px;font-size:16px}
.panel.music{height:auto;max-height:min(520px,calc(100% - 150px))}
#musicList{overflow-y:auto;padding:6px 16px 4px;display:flex;flex-direction:column;gap:6px}
#musicList h3{font-family:"Gowun Batang",serif;font-size:15px;color:var(--soft);margin:10px 0 2px}
.song{text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:10px 14px;font-size:15px}
.song.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.composer .wide{flex:1;padding:11px}
#chatLog{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;font-size:15px;line-height:1.5}
.msg .who{font-size:12px;color:var(--soft);margin-bottom:2px}
.msg .txt{background:var(--card-2);padding:8px 12px;border-radius:14px 14px 14px 4px;display:inline-block;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;text-align:right}
.msg.me .txt{background:var(--btn);color:var(--btn-ink);border-radius:14px 14px 4px 14px}
.empty{color:var(--soft);font-size:14px;text-align:center;margin:auto;padding:20px;line-height:1.6}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer input{margin:0}
.composer button{border:none;border-radius:14px;padding:0 16px;background:var(--btn);color:var(--btn-ink);white-space:nowrap}

.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(10,16,30,.45)}
.modal-card{width:min(520px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 16px);display:flex;flex-direction:column;
  background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.modal-card header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
.modal-card header h2{font-size:21px}
.write{padding:0 20px 14px;border-bottom:1px solid var(--line)}
.write .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.write .row button{border:none;border-radius:999px;padding:10px 20px;background:var(--btn);color:var(--btn-ink)}
#prayList{overflow-y:auto;padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--card-2);border-radius:16px;padding:14px 16px}
.pcard .meta{font-size:13px;color:var(--soft);display:flex;justify-content:space-between;gap:8px}
.pcard p{margin:6px 0 10px;font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.pcard .acts{display:flex;gap:8px;align-items:center}
.pcard .acts button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px}
.pcard .acts button.on{background:var(--glow);border-color:var(--glow);color:#2A2010}
.pcard .acts .del{margin-left:auto;border:none;color:var(--soft)}

.emote-menu{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);display:flex;gap:8px;padding:8px;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.emote-menu button{border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:10px 14px;font-size:15px;white-space:nowrap}
.emote-menu button:hover{background:var(--card-2)}
@media (max-width:560px){.emote-menu{flex-direction:column;bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}}
.verse-card{width:min(460px,100%);text-align:center;padding-bottom:18px}
.verse-card header{justify-content:space-between}
.verse-card blockquote{margin:6px 26px 0;font-family:"Gowun Batang",serif;font-size:20px;line-height:1.85;word-break:keep-all}
.verse-card .ref{margin:14px 0 0;color:var(--soft);font-size:15px}
.verse-acts{display:flex;gap:8px;justify-content:center;margin-top:18px;padding:0 20px;flex-wrap:wrap}
.verse-acts button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:10px 18px;font-size:15px}
.verse-acts button.solid{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.verse-card .src{margin:14px 0 0;font-size:12px;color:var(--soft)}
#toast{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);
  padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .3s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}
@media (max-width:560px){
  .top-right{top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);gap:6px;width:max-content;max-width:calc(100% - 16px)}
  .top-right button,.top-right .linkbtn{width:auto;height:auto;padding:6px 8px;display:inline-flex;align-items:center;font-size:11px;position:relative;white-space:nowrap}
  .top-right .lbl,#newsBtn .lbl,#instaBtn .lbl{display:none}
  .top-right .sl{display:inline}
  .top-right .badge{position:absolute;top:-4px;right:-6px;margin:0}
  .actions{bottom:calc(env(safe-area-inset-bottom,0px) + 54px);gap:5px}
  .actions button{padding:6px 10px;font-size:12px}
  .emote-menu button{padding:7px 10px;font-size:12px}
  #joy{bottom:calc(env(safe-area-inset-bottom,0px) + 140px);width:104px;height:104px}
  #knob{width:44px;height:44px;margin:-22px 0 0 -22px}
  .emote-menu{bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
  .panel{top:calc(env(safe-area-inset-top,0px) + 60px);height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 200px)}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="대동교회 3D 예배당"></canvas>

<div class="entry" id="entry">
  <div class="entry-card">
    <h1>대동교회 크리스마스 예배당</h1>
    <p>나를 닮은 캐릭터를 고르고 들어오세요. 함께 앉아 기도하고, 기도제목을 나눌 수 있어요.</p>
    <canvas id="preview" width="640" height="400" aria-label="캐릭터 미리보기. 왼쪽은 남자, 오른쪽은 여자"></canvas>
    <div class="seg" role="radiogroup" aria-label="캐릭터">
      <button role="radio" data-g="m">남자 캐릭터</button>
      <button role="radio" data-g="f">여자 캐릭터</button>
    </div>
    <div class="opt"><span>스웨터 색</span><div class="swatches" id="swatches" role="radiogroup" aria-label="스웨터 색"></div></div>
    <div class="opt"><label class="check"><input type="checkbox" id="hat"> 산타 모자 쓰기</label></div>
    <label class="field"><span>이름</span><input type="text" id="nick" maxlength="10" placeholder="다른 성도에게 보일 이름" autocomplete="nickname"></label>
    <label class="field" id="pwField" hidden><span>관리자 비밀번호</span><input type="password" id="adminPw" maxlength="40" autocomplete="current-password"></label>
    <button class="primary" id="enterBtn">예배당에 들어가기</button>
  </div>
</div>

<div id="hud" hidden>
  <div class="hud pill top-left"><span class="dot off" id="dot"></span><strong>대동교회</strong><span id="count">혼자 둘러보는 중</span></div>
  <div class="hud top-right">
    <a id="newsBtn" class="linkbtn" href="https://www.daedongch.com/" target="_blank" rel="noopener noreferrer" title="대동교회 소식" aria-label="대동교회 소식 (새 창에서 열림)">⛪<span class="lbl"> 대동교회 소식</span><span class="sl"> 교회소식</span></a>
    <a id="instaBtn" class="linkbtn" href="https://www.instagram.com/daedong1973/" target="_blank" rel="noopener noreferrer" title="대동교회 인스타그램" aria-label="대동교회 인스타그램 (새 창에서 열림)">📸<span class="lbl"> 인스타그램</span><span class="sl"> 인스타</span></a>
    <button id="musicBtn" aria-pressed="false" aria-label="음악 고르기">🎵<span class="lbl"> 음악 바꾸기</span><span class="sl"> 음악</span></button>
    <button id="prayBoardBtn" aria-label="기도제목" title="기도제목">📜<span class="lbl"> 기도제목</span><span class="sl"> 기도제목</span><span class="badge" id="prayCount" hidden>0</span></button>
    <button id="chatBtn" aria-label="대화" title="대화">💬<span class="lbl"> 대화</span><span class="sl"> 대화</span></button>
  </div>
  <div class="hud actions">
    <button id="sitBtn">🪑 자리에 앉기</button>
    <button id="prayBtn">🙏 기도하기</button>
    <button id="kneelBtn">🕯️ 앞에 나가 무릎 꿇기</button>
    <button id="doorBtn" hidden>🚪 문 열기</button>
    <button id="mallowBtn" hidden>🍡 마시멜로 굽기</button>
    <button id="potatoBtn" hidden>🍠 고구마 굽기</button>
    <button id="cocoaBtn" hidden>☕ 코코아 마시기</button>
    <button id="snowBtn" hidden>⛄ 눈사람 만들기</button>
    <button id="standBtn" hidden>일어나기</button>
    <button id="emoteBtn" aria-haspopup="menu" aria-expanded="false">😊 인사</button>
  </div>
  <div class="hud hint" id="hint">WASD·방향키로 걷고, 화면을 끌어 둘러보세요. 의자나 방석을 눌러도 돼요.</div>
  <div id="joy" aria-hidden="true"><div id="knob"></div></div>
</div>

<aside class="panel music" id="musicPanel" hidden aria-label="음악">
  <header><h2>음악</h2><button class="x" id="musicClose" aria-label="음악 닫기">✕</button></header>
  <div id="musicList"></div>
  <div class="composer"><button id="musicOff" class="wide">음악 끄기</button><button id="fireOff" class="wide">🔥 모닥불 소리 끄기</button></div>
</aside>

<aside class="panel" id="chat" hidden aria-label="대화">
  <header><h2>대화</h2><button class="x" id="chatClose" aria-label="대화 닫기">✕</button></header>
  <div id="chatLog"><div class="empty">아직 대화가 없어요.<br>먼저 인사를 건네 보세요.</div></div>
  <div class="composer"><input type="text" id="chatInput" maxlength="120" placeholder="메시지를 입력하세요" aria-label="메시지"><button id="chatSend">보내기</button></div>
</aside>

<div class="modal" id="prayModal" hidden role="dialog" aria-modal="true" aria-labelledby="prayTitle">
  <div class="modal-card">
    <header><h2 id="prayTitle">기도제목 게시판</h2><button class="x" id="prayClose" aria-label="닫기">✕</button></header>
    <div class="write">
      <textarea id="prayInput" maxlength="300" placeholder="함께 기도하고 싶은 제목을 적어 주세요" aria-label="기도제목"></textarea>
      <div class="row"><label class="check"><input type="checkbox" id="anon"> 익명으로 올리기</label><button id="prayPost">올리기</button></div>
    </div>
    <div id="prayList"><div class="empty">아직 올라온 기도제목이 없어요.<br>첫 기도제목을 남겨 주세요.</div></div>
  </div>
</div>

<div class="emote-menu" id="emoteMenu" hidden role="menu" aria-label="인사 동작">
  <button role="menuitem" data-e="wave">👋 손 흔들기</button>
  <button role="menuitem" data-e="bow">🙇 고개 숙여 인사</button>
  <button role="menuitem" data-e="shake">🤝 악수하기</button>
</div>

<div class="modal" id="verseModal" hidden role="dialog" aria-modal="true" aria-labelledby="verseRef">
  <div class="modal-card verse-card">
    <header><h2>📖 오늘의 말씀</h2><button class="x" id="verseClose" aria-label="닫기">✕</button></header>
    <blockquote id="verseText"></blockquote>
    <p class="ref" id="verseRef"></p>
    <div class="verse-acts"><button id="verseNext">다른 말씀 보기</button><button id="verseShare" class="solid">대화에 나누기</button></div>
    <p class="src">성경 본문: 개역한글</p>
  </div>
</div>

const SNOW_LIFE=180000;
setInterval(()=>{
  if(db&&uid&&mySnow&&Array.isArray(mySnow.s)){const keep=mySnow.s.filter(d=>Number(d.t)&&Date.now()-Number(d.t)<SNOW_LIFE);
    if(keep.length!==mySnow.s.length){mySnow.s=keep;db.doc('snowmen/'+uid).set(JSON.parse(JSON.stringify(mySnow))).catch(()=>{});}}
  localSnow=localSnow.filter(d=>Number(d.t)&&Date.now()-Number(d.t)<SNOW_LIFE);

},5000);
function allSnow(){
  const alive=d=>Number(d.t)&&Date.now()-Number(d.t)<SNOW_LIFE;
  if(!(db&&uid))return localSnow.filter(alive).map(d=>({...d,key:'l:'+d.id,who:d.who}));
  const out=[];const docs=snowDocs.some(d=>d.id===uid)?snowDocs:snowDocs.concat([{id:uid,data:mySnow}]);
  docs.forEach(doc=>{const v=doc.id===uid?mySnow:doc.data;const who=(typeof v.n==='string'?v.n:'').slice(0,10)||'성도';
    (Array.isArray(v.s)?v.s:[]).slice(-5).forEach(d=>{if(!d||!Number.isFinite(d.x)||!Number.isFinite(d.z)||!alive(d))return;out.push({key:doc.id+':'+d.id,t:Number(d.t),x:clamp(d.x,-29,29),z:clamp(d.z,3,27),r:Number(d.r)||0,c:(d.c|0)%SCARF.length,h:!!d.h,who});});});
  return out;
}
let snowArm=null,snowArmT=null;
function snowAt(cx,cy){const hits=ray.intersectObjects([...snowMeshes.values()],true);if(!hits.length||hits[0].distance>30)return null;let o=hits[0].object;while(o&&!o.userData.snowKey)o=o.parent;return o?o.userData.snowKey:null;}
function removeSnowman(key){
  const mine=key.startsWith('l:')||(uid&&key.startsWith(uid+':'));
  if(!mine&&!isOwner){toast('다른 성도가 만든 눈사람이에요. 내가 만든 눈사람만 치울 수 있어요.');return;}
  if(snowArm!==key){snowArm=key;clearTimeout(snowArmT);snowArmT=setTimeout(()=>snowArm=null,4000);toast('한 번 더 누르면 이 눈사람을 치워요.');return;}
  snowArm=null;const id=key.slice(key.indexOf(':')+1);
  if(key.startsWith('l:'))localSnow=localSnow.filter(d=>d.id!==id);
  else if(uid&&key.startsWith(uid+':')){mySnow.s=(mySnow.s||[]).filter(d=>d.id!==id);db.doc('snowmen/'+uid).set(JSON.parse(JSON.stringify(mySnow))).catch(()=>toast('치우지 못했어요.'));}
  else if(isOwner&&db){const owner=key.slice(0,key.indexOf(':'));const d=snowDocs.find(x=>x.id===owner);if(d){const s=(Array.isArray(d.data.s)?d.data.s:[]).filter(x=>x&&x.id!==id);db.doc('snowmen/'+owner).update({s}).catch(()=>toast('치우지 못했어요.'));}}
  renderSnow();toast('눈사람을 치웠어요.');
}
function renderSnow(){
  if(!TEX)return;const list=allSnow();const keep=new Set();
  for(const d of list){keep.add(d.key);if(!snowMeshes.has(d.key)){const g=makeSnowman(d);g.userData.snowKey=d.key;g.userData.t=Number(d.t)||Date.now();snowMeshes.set(d.key,g);}}
  for(const [k,g] of snowMeshes)if(!keep.has(k)){scene.remove(g);g.traverse(o=>{if(o.material&&o.material.map&&o.material.map!==TEX.dot)o.material.map.dispose();});snowMeshes.delete(k);}
  snowPts=list.map(d=>({x:d.x,z:d.z}));
}
function startSnowman(){
  if(me.pose!=='stand'&&me.pose!=='pray')standUp();
  const sx=me.x+Math.sin(me.ry)*1.1,sz=me.z+Math.cos(me.ry)*1.1;
  const bad=sz<3.4||blocked(sx,sz)||Math.hypot(sx-CX,sz-CZ)<3.6||Math.hypot(sx-8.6,sz-5.2)<2;
  if(bad){toast('여기는 눈사람을 만들기 어려워요. 앞이 탁 트인 눈밭을 바라보고 다시 눌러 주세요.');return;}
  me.path=null;me.pose='snow';me.snowSpot={x:sx,z:sz,r:me.ry+PI};me.snowT=clock.elapsedTime;updateButtons();toast('눈을 굴려서 커다란 눈덩이를 만드는 중이에요…');
}
function finishSnowman(){
  const sp=me.snowSpot;me.snowSpot=null;me.pose='stand';updateButtons();if(!sp)return;

function nearestW(z){let b=WALKS[0];for(const w of WALKS)if(Math.abs(w-z)<Math.abs(b-z))b=w;return b;}
function buildPath(tx,tz,approachZ){
  const pts=[];let cx=me.x,cz=me.z;

  else if(Math.abs(cx)>1.2)pts.push([0,cz]);
  pts.push([0,approachZ]);pts.push([tx,approachZ]);pts.push([tx,tz]);

}

function campPath(s){
  const pts=[];let cx=me.x,cz=me.z;
  if(cz<-.3){if(cz>-17.4&&cz<-2.9&&Math.abs(cx)>1.2){const w=nearestW(cz);pts.push([cx,w]);pts.push([0,w]);}else if(Math.abs(cx)>1.2)pts.push([0,cz]);pts.push([0,-1]);pts.push([0,3.6]);cx=0;cz=3.6;}
  else if(cz<3.2&&Math.abs(cx)<4.5){pts.push([cx,3.6]);cz=3.6;}
  if(cx>-7.5&&cz<7.4){pts.push([-6,7.6]);cx=-6;cz=7.6;}
  const ax=CX+Math.sin(s.a)*(CR+.85),az=CZ+Math.cos(s.a)*(CR+.85);
  const dx=ax-cx,dz=az-cz,L2=dx*dx+dz*dz||1;let u=((CX-cx)*dx+(CZ-cz)*dz)/L2;u=clamp(u,0,1);
  if(Math.hypot(cx+dx*u-CX,cz+dz*u-CZ)<CR+.4){const mx=(cx+ax)/2-CX,mz=(cz+az)/2-CZ;let ml=Math.hypot(mx,mz);let nx=mx,nz=mz;if(ml<.3){nx=-dz;nz=dx;ml=Math.hypot(nx,nz);}pts.push([CX+nx/ml*(CR+1.1),CZ+nz/ml*(CR+1.1)]);}

function goCamp(kind,seat){

const CATS={xmas:'크리스마스 캐럴',praise:'찬양'};
const music={ctx:null,on:false,song:0,timer:null,songGain:null};
let musicPref=true;try{musicPref=localStorage.getItem('daedong-music')!=='off';const i=+localStorage.getItem('daedong-song');if(SONGS[i])music.song=i;}catch(e){}
function initAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  const ctx=new AC();music.ctx=ctx;
  music.master=ctx.createGain();music.master.gain.value=0;
  music.filter=ctx.createBiquadFilter();music.filter.type='lowpass';music.filter.frequency.value=900;
  const len=ctx.sampleRate*2.6,ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  const verb=ctx.createConvolver();verb.buffer=ir;const wet=ctx.createGain();wet.gain.value=.38;
  music.master.connect(music.filter);music.filter.connect(ctx.destination);music.filter.connect(verb);verb.connect(wet);wet.connect(ctx.destination);
  return true;
}
function bell(t,f,dur,vol,dest){
  const c=music.ctx,g=c.createGain(),o=c.createOscillator(),o2=c.createOscillator(),g2=c.createGain();
  o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.22;
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(dest);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+dur+1.1);
  o.start(t);o2.start(t);o.stop(t+dur+1.2);o2.stop(t+dur+1.2);
}
function organ(t,f,dur,vol,dest){
  const c=music.ctx,g=c.createGain();g.connect(dest);
  [[1,1],[2,.32],[3,.12],[4,.07]].forEach(([m,a])=>{const o=c.createOscillator(),og=c.createGain();o.type='sine';o.frequency.value=f*m;og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.8);});
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.09);g.gain.setValueAtTime(vol*.9,t+Math.max(.1,dur-.06));g.gain.exponentialRampToValueAtTime(.0008,t+dur+.7);
}
function pad(t,f,dur,vol,dest){
  const c=music.ctx,g=c.createGain(),o=c.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(dest);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.35);g.gain.setValueAtTime(vol,t+Math.max(.36,dur-.2));g.gain.exponentialRampToValueAtTime(.0008,t+dur+.6);
  o.start(t);o.stop(t+dur+.7);
}
function cutCurrent(){
  clearTimeout(music.timer);const sg=music.songGain;music.songGain=null;
  if(sg&&music.ctx){sg.gain.setTargetAtTime(0,music.ctx.currentTime,.08);setTimeout(()=>sg.disconnect(),700);}
}
function playSong(){
  if(!music.on)return;
  const c=music.ctx,s=SONGS[music.song];
  const sg=c.createGain();sg.connect(music.master);music.songGain=sg;
  let t=c.currentTime+.3,t0=t;
  for(const [n,d] of s.mel){const dur=d*s.unit;if(s.voice==='organ'){organ(t,freq(n),dur,.09,sg);if(!s.ch)organ(t,freq(n)/2,dur,.035,sg);}else{bell(t,freq(n),dur,s.vol||.16,sg);if(!s.ch&&!s.solo)bell(t,freq(n)/2,dur,.05,sg);}t+=dur;}
  if(s.ch){let tc=t0;for(const [n,d] of s.ch){const dur=d*s.unit;if(CHORD[n]){CHORD[n].forEach(x=>pad(tc,freq(x),dur,.035,sg));if(s.bass)bell(tc,freq(CHORD[n][0])/2,dur,.06,sg);}tc+=dur;}}
  if(!$('#hud').hidden)toast('♪ '+s.name);
  renderMusicList();
  const cat=s.cat;let nx=music.song;do{nx=(nx+1)%SONGS.length;}while(SONGS[nx].cat!==cat);
  music.timer=setTimeout(()=>{music.song=nx;playSong();},(t-c.currentTime+2.4)*1000);
}
function startMusic(idx){
  if(!music.ctx&&!initAudio()){toast('이 브라우저에서는 음악을 재생할 수 없어요.');return;}
  music.ctx.resume();cutCurrent();music.on=true;
  if(idx!==undefined&&SONGS[idx]){music.song=idx;try{localStorage.setItem('daedong-song',idx);}catch(e){}}
  const now=music.ctx.currentTime;music.master.gain.cancelScheduledValues(now);music.master.gain.setTargetAtTime(.9,now,.4);
  playSong();updateMusicBtn();
}
function stopMusic(){
  music.on=false;cutCurrent();
  if(music.ctx){const now=music.ctx.currentTime;music.master.gain.cancelScheduledValues(now);music.master.gain.setTargetAtTime(0,now,.15);}
  updateMusicBtn();
}
function setMusicRoom(inside){
  if(!music.on)return;const now=music.ctx.currentTime;
  music.filter.frequency.setTargetAtTime(inside?12000:900,now,.5);music.master.gain.setTargetAtTime(inside?.95:.5,now,.5);
}
function renderMusicList(){
  const el=$('#musicList');el.textContent='';
  for(const cat of Object.keys(CATS)){
    const h=document.createElement('h3');h.textContent=CATS[cat];el.append(h);
    SONGS.forEach((s,i)=>{if(s.cat!==cat)return;const b=document.createElement('button');b.className='song';const playing=music.on&&music.song===i;
      b.classList.toggle('on',playing);b.setAttribute('aria-pressed',playing);b.textContent=(playing?'♪ ':'')+s.name;
      b.onclick=()=>{musicPref=true;try{localStorage.setItem('daedong-music','on');}catch(e){}startMusic(i);};el.append(b);});
  }
  $('#musicOff').textContent=music.on?'음악 끄기':'음악 켜기';
}
function updateMusicBtn(){const b=$('#musicBtn');b.classList.toggle('on',music.on);b.setAttribute('aria-pressed',music.on);renderMusicList();}
$('#musicBtn').onclick=()=>{const p=$('#musicPanel');p.hidden=!p.hidden;if(!p.hidden){$('#chat').hidden=true;renderMusicList();}};
$('#musicClose').onclick=()=>{$('#musicPanel').hidden=true;canvas.focus();};
const fireS={on:false,gain:null,timer:null,buf:null,vol:0};
let firePref=true;try{firePref=localStorage.getItem('daedong-fire')!=='off';}catch(e){}
function ensureAudio(){if(!music.ctx&&!initAudio())return false;music.ctx.resume();return true;}
const SILENT_WAV='data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
let unlockEl=null;
function unlockAudio(){
  try{if(!unlockEl){unlockEl=document.createElement('audio');unlockEl.setAttribute('playsinline','');unlockEl.setAttribute('webkit-playsinline','');unlockEl.loop=true;unlockEl.src=SILENT_WAV;}
    unlockEl.play().catch(()=>{});}catch(e){}
  if(music.ctx&&music.ctx.state!=='running')music.ctx.resume().catch(()=>{});
}
['touchend','pointerup','keydown'].forEach(ev=>addEventListener(ev,()=>{if(entered)unlockAudio();},{passive:true}));

function startFireSound(){
  if(!ensureAudio())return;const c=music.ctx;
  if(!fireS.gain){
    fireS.gain=c.createGain();fireS.gain.gain.value=0;fireS.gain.connect(c.destination);
    const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;d[i]=w;}fireS.buf=b;
    const br=c.createBuffer(1,len,c.sampleRate),bd=br.getChannelData(0);for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;bd[i]=last*3.5;}
    const rum=c.createBufferSource();rum.buffer=br;rum.loop=true;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;const rg=c.createGain();rg.gain.value=.22;
    rum.connect(lp);lp.connect(rg);rg.connect(fireS.gain);rum.start();
    const hiss=c.createBufferSource();hiss.buffer=b;hiss.loop=true;const hp=c.createBiquadFilter();hp.type='bandpass';hp.frequency.value=1800;hp.Q.value=.6;const hg=c.createGain();hg.gain.value=.008;
    hiss.connect(hp);hp.connect(hg);hg.connect(fireS.gain);hiss.start();
  }
  fireS.on=true;updateFireBtn();
  clearInterval(fireS.timer);fireS.timer=setInterval(()=>{if(!fireS.on||fireS.vol<.02||document.hidden)return;
    const n=Math.random()<.05?2+Math.floor(Math.random()*2):(Math.random()<.32?1:0);for(let i=0;i<n;i++)pop(c.currentTime+.01+Math.random()*.08+i*rand(.04,.12));},90);
}
function pop(t){
  const c=music.ctx,src=c.createBufferSource();src.buffer=fireS.buf;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=rand(700,2600);bp.Q.value=rand(1.2,3.5);
  const g=c.createGain(),dur=rand(.008,.04),pk=Math.random()<.12?rand(.35,.55):rand(.08,.28);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+.0015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(bp);bp.connect(g);g.connect(fireS.gain);src.start(t,Math.random()*1.8,dur+.02);
}
function stopFireSound(){fireS.on=false;clearInterval(fireS.timer);if(fireS.gain)fireS.gain.gain.setTargetAtTime(0,music.ctx.currentTime,.2);updateFireBtn();}
function updateFireSound(d,inside){
  if(!fireS.on||!fireS.gain)return;let v=Math.pow(clamp(1-d/16,0,1),1.8)*.38;if(inside)v*=.06;
  fireS.vol=v;fireS.gain.gain.setTargetAtTime(v,music.ctx.currentTime,.25);
}
function updateFireBtn(){const b=$('#fireOff');if(b)b.textContent=fireS.on?'🔥 모닥불 소리 끄기':'🔥 모닥불 소리 켜기';}
$('#fireOff').onclick=()=>{if(fireS.on){stopFireSound();firePref=false;}else{startFireSound();firePref=true;}try{localStorage.setItem('daedong-fire',firePref?'on':'off');}catch(e){}};
$('#musicOff').onclick=()=>{if(music.on){stopMusic();musicPref=false;}else{startMusic();musicPref=true;}try{localStorage.setItem('daedong-music',musicPref?'on':'off');}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(!music.ctx)return;if(document.hidden)music.ctx.suspend();else if(music.on||fireS.on)music.ctx.resume();});

/* ---------- 루프 ---------- */
const perf={t0:0,f:0,q:0,told:false};
function applyQuality(q){
  const pr=[Math.min(window.devicePixelRatio||1,1.5),1,.8,.65][q];
  renderer.setPixelRatio(pr);renderer.setSize(innerWidth,innerHeight);
  if(snow&&snow.points){snow.points.geometry.setDrawRange(0,q>=2?Math.floor(snow.N/3):snow.N);snow.points.visible=q<3;}
  if(fire&&fire.embers)fire.embers.visible=q<2;
  if(!perf.told){perf.told=true;toast('화면이 버벅여서 그래픽을 조금 가볍게 조정했어요.');}
}

const clock=new THREE.Clock();let tw=0;
const camTarget=new THREE.Vector3(),camPos=new THREE.Vector3();
function angLerp(a,b,k){let d=((b-a+PI)%(2*PI)+2*PI)%(2*PI)-PI;return a+d*k;}
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  {const now=performance.now();if(!perf.t0)perf.t0=now;perf.f++;if(now-perf.t0>2500){const fps=perf.f*1000/(now-perf.t0);perf.t0=now;perf.f=0;if(entered&&fps<30&&perf.q<3){perf.q++;applyQuality(perf.q);}}}
  if(snow){const p=snow.pos;for(let i=0;i<snow.N;i++){p[i*3+1]-=snow.speed[i]*dt;p[i*3]+=Math.sin(t*.7+i)*.004;if(p[i*3+1]<0)resetFlake(i,false);}snow.points.geometry.attributes.position.needsUpdate=true;}
  tw+=dt;if(tw>.08){tw=0;twinkle(t);}
  animateFire(t,dt);
  if(door.panels){door.amt+=((door.open?1:0)-door.amt)*(1-Math.exp(-dt*4));const e=door.amt<.5?2*door.amt*door.amt:1-Math.pow(-2*door.amt+2,2)/2;door.panels.forEach(p=>p.g.rotation.y=p.s*1.4*e);}
  for(const g of snowMeshes.values()){const left=SNOW_LIFE-(Date.now()-(g.userData.t||0));const s=left<8000?Math.max(.05,left/8000):1;g.scale.set(1,s,1);}
  candleMeshes.forEach((f,i)=>{if(f.visible)f.scale.set(1+Math.sin(t*11+i)*.15,1.8+Math.sin(t*15+i*1.3)*.3,1);});
  flames.forEach((f,i)=>{f.scale.set(1+Math.sin(t*13+i)*.12,1.7+Math.sin(t*17+i*2)*.25,1);});
  if(entered&&me.ch){
    let ix=0,iz=0;
    if(!isTyping()){if(keys.w||keys.arrowup)iz+=1;if(keys.s||keys.arrowdown)iz-=1;if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;}
    ix+=joy.x;iz-=joy.y;
    me.moving=false;
    if(Math.hypot(ix,iz)>.15){
      if(me.pose!=='stand')standUp();me.path=null;me.emote='';updateButtons();
      const m=Math.min(1,Math.hypot(ix,iz));const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
      let dx=fx*iz+rx*ix,dz=fz*iz+rz*ix;const l=Math.hypot(dx,dz);dx/=l;dz/=l;const sp=3.4*m*dt;
      const nx=me.x+dx*sp,nz=me.z+dz*sp;const stuck=blocked(me.x,me.z);
      if(stuck||!blocked(nx,me.z))me.x=nx;const bz=blocked(me.x,nz);if(stuck||!bz)me.z=nz;
      else if(bz==='door'&&t-door.hintT>4){door.hintT=t;toast('문이 닫혀 있어요. 문을 누르거나 아래 버튼으로 열어 주세요.');}
      me.ry=angLerp(me.ry,Math.atan2(dx,dz),1-Math.exp(-dt*14));me.moving=true;
    }else if(me.path&&me.path.length){
      const [tx,tz]=me.path[0];const dx=tx-me.x,dz=tz-me.z,d=Math.hypot(dx,dz),sp=3.6*dt;
      if(!door.open&&Math.abs(me.x)<3&&Math.abs(me.z)<2.6&&Math.sign(tz+.3)!==Math.sign(me.z+.3)){setDoor(true);toast('문을 열고 지나갈게요.');}
      if(d<=sp){me.x=tx;me.z=tz;me.path.shift();if(!me.path.length){me.path=null;const f=me.onArrive;me.onArrive=null;updateButtons();f&&f();}}
      else{me.x+=dx/d*sp;me.z+=dz/d*sp;me.ry=angLerp(me.ry,Math.atan2(dx,dz),1-Math.exp(-dt*14));me.moving=true;}
    }
    if(me.prayUntil&&t>me.prayUntil){me.prayUntil=0;if(me.pose==='pray')me.pose='stand';else if(me.pose==='sitpray')me.pose='sit';updateButtons();}
    if(me.pose==='sit'||me.pose==='sitpray'||me.pose==='kneel')me.ry=angLerp(me.ry,PI,1-Math.exp(-dt*10));
    if(isCamp(me.pose))me.ry=angLerp(me.ry,Math.atan2(CX-me.x,CZ-me.z),1-Math.exp(-dt*10));
    {const nc=isCamp(me.pose)||Math.hypot(me.x-CX,me.z-CZ)<9;if(nc!==nearCamp||(Math.hypot(me.x,me.z+.3)<4.2)!==nearDoor||(me.z>3)!==nearSnow)updateButtons();}
    me.y+=(poseY(me.pose,me.x,me.z)-me.y)*(1-Math.exp(-dt*14));
    me.ch.root.position.set(me.x,me.y,me.z);me.ch.root.rotation.y=me.ry;
    if(me.emote&&t-me.emoteT>ED[me.emote])me.emote='';
    const ev=animateChar(me.ch,me.pose,me.moving,t,dt,me.emote,t-me.emoteT);
    if(me.pose==='snow'&&t-me.snowT>6)finishSnowman();
    if(me.pose==='mallow'||me.pose==='potato'){if(ev>lastEv){toast(me.pose==='mallow'?'🍡 마시멜로가 노릇노릇 구워졌어요. 냠냠! 새로 하나 더 꽂았어요.':'🍠 고구마가 달콤하게 익었어요. 호호 불어 먹는 중!');}lastEv=ev;}else lastEv=0;
    updateFireSound(Math.hypot(me.x-CX,me.z-CZ),me.z<-.6);
    // 카메라
    const inside=me.z<-.6;
    if(inside&&!wasInside&&musicPref&&music.ctx&&!music.on)startMusic(calmSong());
    wasInside=inside;
    camTarget.set(me.x,me.y+1.05,me.z);
    const d=inside?Math.min(dist,6.5):dist;
    camPos.set(me.x+Math.sin(yaw)*Math.cos(pitch)*d,me.y+1.05+Math.sin(pitch)*d,me.z+Math.cos(yaw)*Math.cos(pitch)*d);
    if(inside){camPos.x=clamp(camPos.x,-14.6,14.6);camPos.z=clamp(camPos.z,-24.6,-.8);camPos.y=clamp(camPos.y,1,6.05);}
    else{camPos.y=Math.max(camPos.y,.5);if(me.z>.6&&camPos.z<.7)camPos.z=.7;}
    camera.position.lerp(camPos,1-Math.exp(-dt*10));camera.lookAt(camTarget);
    sendPresence(t);
    if(music.ctx)setMusicRoom(inside);
  }else{
    const a=t*.06;camera.position.set(Math.sin(a)*8,7.5,22+Math.cos(a)*3);camera.lookAt(0,6.5,0);
  }
  for(const e of peers.values()){
    const k=1-Math.exp(-dt*8);const dx=e.tx-e.x,dz=e.tz-e.z;const moving=Math.hypot(dx,dz)>.03&&e.pose==='stand'||Math.hypot(dx,dz)>.2;
    e.x+=dx*k;e.z+=dz*k;e.ry=angLerp(e.ry,e.try,k);e.y+=(poseY(e.pose,e.x,e.z)-e.y)*k;
    e.ch.root.position.set(e.x,e.y,e.z);e.ch.root.rotation.y=e.ry;if(e.emote&&t-e.emoteStart>ED[e.emote])e.emote='';animateChar(e.ch,e.pose,moving,t,dt,e.emote,t-(e.emoteStart||0));
  }
  if(pv.r&&pv.chars){pv.chars.forEach((ch,i)=>{const sel=(i===0)===(state.g==='m');ch.root.rotation.y=Math.sin(t*.8+i)*.35;ch.root.position.y=sel?Math.abs(Math.sin(t*4))*.08:0;
      animateChar(ch,'stand',false,t,dt);ch.armL.rotation.z=sel?-.12-Math.abs(Math.sin(t*4))*.5:-.12;});pv.r.render(pv.s,pv.c);}
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  if(pv.r)pv.r.setSize(pv.el.clientWidth,pv.el.clientHeight,false);});

/* ---------- 시작 ---------- */
const fontsReady=Promise.race([Promise.all([document.fonts.load('700 40px "Gowun Batang"'),document.fonts.load('30px "Gowun Dodum"')]).catch(()=>{}),new Promise(r=>setTimeout(r,2500))]);
fontsReady.then(()=>{buildWorld();initPreview();renderPrayers();try{renderer.compile(scene,camera);}catch(e){}tick();initNet().catch(()=>{}).finally(()=>netReadyResolve());});
})();
</script>
